<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>EduConnect — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --ink:#ffffff;--deep:#0f172a;--card:#ffffff;
  --accent:#001f54;--accent2:#133c72;--gold:#f59e0b;--coral:#ef4444;
  --text:#0f172a;--muted:#64748b;--border:rgba(15,23,42,.12);
  --font-display:'Poppins', Arial, Helvetica, sans-serif;--font-body:'Inter', Arial, Helvetica, sans-serif;
}
html,body{height:100%;font-family:var(--font-body);} 
body{
  min-height:100vh;
  margin:0;
  font-family:var(--font-body);
  background:#eef4fb;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  overflow:hidden;
}
.bg-image{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background-image: url('assets/login-bg.jpeg');
  background-size:cover;
  background-position:center center;
  background-repeat:no-repeat;
  filter:none;
  opacity:1;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:none;
  pointer-events:none;
}
.login-layout{
  position:relative;
  z-index:1;
  width:100%;
  max-width:520px;
  border-radius:32px;
  overflow:hidden;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(16px);
  box-shadow:0 32px 90px rgba(15,23,42,.24);
  border:1px solid rgba(255,255,255,.45);
}
.login-card{
  padding:40px 36px 38px;
}
.brand-banner{
  position:relative;
  text-align:center;
  padding:24px 22px 18px;
  background:linear-gradient(135deg,#001f54,#133c72);
  border-bottom:1px solid rgba(255,255,255,.15);
}
.brand-banner .brand-logo{font-size:1.5rem;font-family:var(--font-display);font-weight:800;color:#ffffff;letter-spacing:-1px;}
.brand-banner .lang-switcher{
  position:absolute;
  top:14px;
  right:14px;
  padding:7px 10px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.18);
  background:#001f54;
  color:#ffffff;
  font-size:.78rem;
  min-width:92px;
  cursor:pointer;
}
.brand-banner .lang-switcher option{
  background:#ffffff;
  color:#111827;
}
.brand-banner .brand-sub{margin-top:6px;font-size:.78rem;color:rgba(255,255,255,.8);text-transform:uppercase;letter-spacing:.18em;}
.card-head{margin-top:26px;text-align:center;}
.card-head h1{font-family:var(--font-display);font-size:1.25rem;color:#0f172a;letter-spacing:.04em;margin-bottom:8px;}
.card-head p{font-size:.86rem;color:#475569;margin-bottom:26px;}
.switch-row{
  display:flex;
  justify-content:center;
  gap:28px;
  margin-bottom:22px;
  font-size:.92rem;
  color:#475569;
}
.switch-row label{display:flex;align-items:center;gap:8px;cursor:pointer;}
.switch-row input{accent-color:var(--accent);}
.username-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
}
.username-row .input-wrap{flex:1;}
.domain-tag{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px 14px;
  border-radius:14px;
  background:rgba(0,31,84,.08);
  border:1px solid rgba(0,31,84,.18);
  color:#001f54;
  font-size:.92rem;
  min-width:120px;
}
.field{margin-bottom:18px;}
.field label{display:block;font-size:.75rem;color:#6b7280;margin-bottom:8px;letter-spacing:.08em;text-transform:uppercase;}
.input-wrap{position:relative;}
.input-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:.95rem;pointer-events:none;}
.input-wrap input{
  width:100%;padding:14px 14px 14px 42px;border-radius:16px;
  border:1px solid rgba(148,163,184,.2);background:#f8fbff;
  color:#0f172a;font-family:var(--font-body);font-size:.95rem;outline:none;transition:.3s;
}
.input-wrap input:focus{border-color:rgba(0,31,84,.6);background:#ffffff;box-shadow:0 0 0 4px rgba(0,31,84,.12);}
.btn-login{
  width:100%;padding:16px;border-radius:18px;border:none;
  background:linear-gradient(135deg,#001f54,#133c72);
  color:#fff;font-weight:700;font-size:.97rem;cursor:pointer;
  font-family:var(--font-body);letter-spacing:.03em;transition:.25s;margin-top:4px;
}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 16px 35px rgba(0,31,84,.3);}
.actions-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  margin-top:18px;
  font-size:.85rem;
  color:#475569;
}
.actions-row a{color:var(--accent);text-decoration:none;}
.actions-row a:hover{color:#001f54;}
.focus-note{
  margin-top:20px;
  padding:16px 18px;
  border-radius:18px;
  background:rgba(0,31,84,.09);
  border:1px solid rgba(0,31,84,.14);
  color:#0f172a;
  font-size:.85rem;
  line-height:1.6;
  text-align:center;
}
@media(max-width:520px){
  .login-layout{max-width:100%;}
  .username-row{grid-template-columns:1fr;}
  .domain-tag{min-width:auto;justify-content:center;}
  .actions-row{flex-direction:column;align-items:flex-start;}
}
.error-box{
  padding:12px 14px;border-radius:10px;font-size:.85rem;margin-bottom:18px;
  display:none;align-items:center;gap:8px;
}
.error-box.err{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--coral);}
.error-box.ok{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:var(--accent);}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:720px){
  .login-layout{flex-direction:column;max-width:460px;border-radius:24px;}
  .left-panel{display:none;}
  .right-panel{width:100%;border-radius:24px;padding:34px 26px;}
}
</style>
</head>
<body>
<div class="bg-image" aria-hidden="true"></div>
<div class="login-layout">
  <div class="brand-banner">
    <div class="brand-logo">EDU CONNECT</div>
    <div class="brand-sub" data-i18n="auth.brandSub">connecting education</div>
    <select class="lang-switcher" data-lang-switcher>
      <option value="en">English</option>
      <option value="hi">हिंदी</option>
      <option value="ta">தமிழ்</option>
      <option value="te">తెలుగు</option>
      <option value="kn">ಕನ್ನಡ</option>
    </select>
  </div>

  <div class="login-card">
    <div class="card-head">
      <h1 data-i18n="auth.schoolName">SRI SAIRAM INTERNATIONAL SCHOOL</h1>
      <p data-i18n="auth.subHeading">Sign in with your school credentials.</p>
    </div>

    <div class="error-box" id="msgBox"></div>

    <div class="switch-row">
      <label><input type="radio" name="loginType" value="staff" checked> <span data-i18n="auth.staff">Staff</span></label>
      <label><input type="radio" name="loginType" value="parent"> <span data-i18n="common.parent">Parent</span></label>
    </div>

    <div class="username-row">
      <div class="field input-wrap">
        <label data-i18n="auth.username">Username or email</label>
        <i class="fa fa-user"></i>
        <input type="text" id="email" data-i18n-placeholder="auth.usernamePlaceholder" placeholder="Username or email" autocomplete="username" />
      </div>
    </div>

    <div class="field">
      <label data-i18n="auth.password">Password</label>
      <div class="input-wrap">
        <i class="fa fa-key"></i>
        <input type="password" id="password" data-i18n-placeholder="auth.passwordPlaceholder" placeholder="Password" autocomplete="current-password" />
      </div>
    </div>

    <div class="actions-row">
      <label><input type="checkbox" id="rememberMe" /> <span data-i18n="auth.remember">Remember?</span></label>
      <a href="forgot.html" data-i18n="auth.forgot">Forgot your password?</a>
    </div>

    <button class="btn-login" id="loginBtn" onclick="doLogin()" data-i18n="auth.login">login</button>

    <div class="focus-note" data-i18n="auth.focusNote">Use your school-issued username and password to access the portal.</div>

  </div>
</div>

<script src="lang.js"></script>
<script>
const API = '';  // same origin — backend serves frontend

function getSelectedRole() {
  const selected = document.querySelector('input[name="loginType"]:checked');
  return selected ? selected.value : 'staff';
}

function showMsg(msg, type='err') {
  const el = document.getElementById('msgBox');
  if (!el) {
    console.error('showMsg: msgBox element not found');
    return;
  }
  el.textContent = msg;
  el.className = `error-box ${type}`;
  el.style.display = 'flex';
}

const pwInput = document.getElementById('password');
if (pwInput) {
  pwInput.addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
}

initLanguage({ titleKey: 'app.title.login' });

async function doLogin() {
  const username = document.getElementById('email')?.value.trim();
  const password = document.getElementById('password')?.value;
  if (!username || !password) { showMsg(window.t('auth.enterCredentials')); return; }

  const email = username;
  const selectedRole = getSelectedRole();

  const btn = document.getElementById('loginBtn');
  if (!btn) {
    console.error('doLogin: loginBtn element not found');
    showMsg('Login button is not available. Please reload the page.');
    return;
  }
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> ' + window.t('auth.signingIn');

  try {
    const res  = await fetch('https://erp-3-dgz3.onrender.com/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, selectedRole }),
    });
    const data = await res.json();
    if (!res.ok) { showMsg(data.error || window.t('auth.loginFailed')); return; }

    // Store session
    sessionStorage.setItem('token', data.token);
    sessionStorage.setItem('user', JSON.stringify(data.user));
    if (data.student) sessionStorage.setItem('student', JSON.stringify(data.student));

    // Redirect
    if (data.user.role === 'admin') window.location.href = 'admin.html';
    else window.location.href = 'dashboard.html';

  } catch {
    showMsg(window.t('auth.serverUnavailable'));
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = 'Login';
    }
  }
}
</script>
</body>
</html>
