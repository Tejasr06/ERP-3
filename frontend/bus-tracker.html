<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>EduConnect — Live Bus Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
<style>
  :root{--bg:#f4f7fb;--card:#ffffff;--text:#111827;--muted:#64748b;--primary:#0d6efd;--success:#16a34a;--warning:#f59e0b;--danger:#ef4444;--border:rgba(13,110,253,.12);}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Outfit',Arial,sans-serif;}
  body{background:var(--bg);color:var(--text);min-height:100vh;}
  .page-wrap{max-width:1180px;margin:0 auto;padding:20px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px;}
  .topbar h1{font-family:'Cormorant Garamond',serif;font-size:2rem;color:var(--primary);}
  .topbar small{color:var(--muted);}
  .btn{padding:10px 16px;border-radius:12px;border:none;background:var(--primary);color:#fff;font-weight:600;cursor:pointer;transition:.2s;}
  .btn:hover{background:#0b5ed7;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:20px;box-shadow:0 18px 45px rgba(15,23,42,.06);}
  .card-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .info-row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px;}
  .info-block{flex:1 1 220px;background:#f8fbff;border:1px solid rgba(13,110,253,.12);border-radius:14px;padding:18px;}
  .info-label{font-size:.78rem;color:var(--muted);margin-bottom:6px;}
  .info-val{font-size:1.3rem;font-weight:700;color:var(--text);}
  .map-card{border-radius:18px;overflow:hidden;height:340px;background:#e2e8f0;display:flex;align-items:center;justify-content:center;color:var(--muted);position:relative;}
  .map-card iframe{width:100%;height:100%;border:0;}
  .loader{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.12);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .list{list-style:none;margin-top:14px;}
  .list li{padding:12px 14px;border:1px solid rgba(15,23,42,.06);border-radius:12px;background:#f8fbff;margin-bottom:10px;font-size:.94rem;}
  .highlight{color:var(--primary);font-weight:700;}
  .empty{padding:36px 18px;text-align:center;color:var(--muted);}
  .hero{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:22px;}
  .hero .hero-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;}
  @media(max-width:900px){.card-grid,.hero{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="page-wrap">
  <div class="topbar">
    <div>
      <h1>Live Bus Tracker</h1>
      <small>View your child's current bus location, ETA, driver details, and route.</small>
    </div>
    <button class="btn" onclick="loadTracker()"><i class="fa fa-sync-alt"></i> Refresh</button>
  </div>

  <div id="trackerRoot" class="card">
    <div class="empty"><span class="loader"></span> Loading bus tracker…</div>
  </div>
</div>

<script>
const TOKEN = sessionStorage.getItem('token');
const USER = JSON.parse(sessionStorage.getItem('user') || 'null');
if (!TOKEN || !USER || USER.role !== 'parent') { location.href = 'index.html'; }
const API = '';

async function req(method, path, body) {
  const opts = { method, headers: { Authorization: 'Bearer ' + TOKEN, 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function formatRouteStops(route) {
  if (!route || !route.stops || !route.stops.length) return '<div style="color:var(--muted);">No route stops configured.</div>';
  return '<ul class="list">' + route.stops.map((stop, idx) => `<li><strong>Stop ${idx+1}:</strong> ${stop}</li>`).join('') + '</ul>';
}

function renderTrack(data) {
  const root = document.getElementById('trackerRoot');
  if (!data.assigned) {
    root.innerHTML = `<div class="empty"><div style="font-size:1rem;">${data.message || 'No bus assignment available at this time.'}</div></div>`;
    return;
  }
  const bus = data.bus || {};
  const route = data.route || {};
  const coords = bus.coordinates || {};
  const hasMap = coords.lat && coords.lng;
  const mapHtml = hasMap
    ? `<iframe src="https://www.openstreetmap.org/export/embed.html?bbox=${coords.lng-0.02}%2C${coords.lat-0.02}%2C${coords.lng+0.02}%2C${coords.lat+0.02}&layer=mapnik&marker=${coords.lat}%2C${coords.lng}"></iframe>`
    : `<div class="empty">Live map unavailable. Current location text shown below.</div>`;

  root.innerHTML = `
    <div class="hero">
      <div class="hero-card">
        <div class="info-row">
          <div class="info-block"><div class="info-label">Bus Number</div><div class="info-val">${bus.busNo || 'N/A'}</div></div>
          <div class="info-block"><div class="info-label">Current Location</div><div class="info-val">${bus.currentLocation || 'N/A'}</div></div>
        </div>
        <div class="info-row" style="margin-top:16px;">
          <div class="info-block"><div class="info-label">ETA</div><div class="info-val">${bus.eta || 'TBD'}</div></div>
          <div class="info-block"><div class="info-label">Route</div><div class="info-val">${route.name || 'N/A'}</div></div>
        </div>
        <div style="margin-top:18px;"><div class="info-label">Direction</div><div class="info-val">${data.pickupPoint || 'Pickup'} → ${data.dropPoint || 'Drop'}</div></div>
      </div>
      <div class="hero-card">
        <div class="info-row">
          <div class="info-block"><div class="info-label">Driver</div><div class="info-val">${bus.driverName || 'N/A'}</div></div>
          <div class="info-block"><div class="info-label">Phone</div><div class="info-val">${bus.driverPhone || 'N/A'}</div></div>
        </div>
        <div style="margin-top:18px;"><div class="info-label">Pickup Point</div><div class="info-val">${data.pickupPoint || 'Not assigned'}</div></div>
        <div style="margin-top:16px;"><div class="info-label">Drop Point</div><div class="info-val">${data.dropPoint || 'Not assigned'}</div></div>
      </div>
    </div>
    <div class="card">
      <div style="font-size:1rem;font-weight:700;margin-bottom:12px;color:var(--text);">Route Map</div>
      <div class="map-card">${mapHtml}</div>
      <div style="margin-top:18px;">
        <div style="font-size:1rem;font-weight:700;margin-bottom:10px;color:var(--text);">Route Stops</div>
        ${formatRouteStops(route)}
      </div>
    </div>
    <div class="card">
      <div style="font-size:1rem;font-weight:700;margin-bottom:12px;color:var(--text);">Route Details</div>
      <div class="info-row">
        <div class="info-block"><div class="info-label">Route Code</div><div class="info-val">${route.routeCode || 'N/A'}</div></div>
        <div class="info-block"><div class="info-label">Route Name</div><div class="info-val">${route.name || 'N/A'}</div></div>
      </div>
      <div style="margin-top:14px;font-size:.92rem;color:var(--muted);">${route.description || 'No additional route notes.'}</div>
    </div>
  `;
}

async function loadTracker() {
  const root = document.getElementById('trackerRoot');
  root.innerHTML = '<div class="empty"><span class="loader"></span> Loading current bus details…</div>';
  try {
    const data = await req('GET', '/api/bus-tracker/me');
    renderTrack(data);
  } catch (err) {
    root.innerHTML = `<div class="empty">${err.message || 'Could not load bus tracker.'}</div>`;
  }
}

loadTracker();
</script>
</body>
</html>
