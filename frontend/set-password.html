<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>EduConnect — Set Password</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--ink:#ffffff;--card:#ffffff;--teal:#0d6efd;--sky:#60a5fa;--coral:#ef4444;--gold:#f59e0b;--text:#111827;--muted:#6b7280;--border:rgba(0,0,0,0.06);--font-display:Arial, Helvetica, sans-serif;--font-body:Arial, Helvetica, sans-serif;}
html,body{height:100%;font-family:var(--font-body);background:var(--ink);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;}
.bg-orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;}
.orb1{width:400px;height:400px;background:radial-gradient(circle,rgba(0,212,170,.15),transparent 70%);top:-100px;left:-100px;}
.orb2{width:350px;height:350px;background:radial-gradient(circle,rgba(56,189,248,.1),transparent 70%);bottom:-80px;right:-80px;}
.card{position:relative;z-index:1;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:44px 40px;width:100%;max-width:420px;box-shadow:0 32px 80px rgba(0,0,0,.5);}
.logo{font-family:var(--font-display);font-size:1.8rem;background:linear-gradient(135deg,var(--teal),var(--sky));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px;}
.title{font-family:var(--font-display);font-size:1.5rem;margin:24px 0 4px;}
.sub{font-size:.85rem;color:var(--muted);margin-bottom:28px;line-height:1.6;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:7px;letter-spacing:.08em;text-transform:uppercase;}
.input-wrap{position:relative;}
.input-wrap i.icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem;}
.input-wrap input{width:100%;padding:12px 14px 12px 38px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);font-family:var(--font-body);font-size:.92rem;outline:none;transition:.2s;}
.input-wrap input:focus{border-color:var(--teal);background:rgba(0,212,170,.04);}
.eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);cursor:pointer;}
.eye:hover{color:var(--text);}
.strength{height:4px;border-radius:2px;margin-top:8px;background:rgba(255,255,255,.06);overflow:hidden;}
.strength-fill{height:100%;border-radius:2px;transition:width .3s,background .3s;width:0%;}
.strength-label{font-size:.72rem;color:var(--muted);margin-top:4px;}
.btn{width:100%;padding:13px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--teal),var(--sky));color:var(--ink);font-weight:700;font-size:.95rem;cursor:pointer;font-family:var(--font-body);transition:.2s;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,212,170,.35);}
.btn:disabled{opacity:.6;transform:none;}
.msg{padding:12px 14px;border-radius:9px;font-size:.83rem;margin-bottom:16px;display:none;align-items:center;gap:8px;}
.msg.err{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--coral);}
.msg.ok{background:rgba(0,212,170,.1);border:1px solid rgba(0,212,170,.3);color:var(--teal);}
.back{text-align:center;margin-top:20px;font-size:.83rem;color:var(--muted);}
.back a{color:var(--teal);text-decoration:none;}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(13,17,23,.3);border-top-color:var(--ink);border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.rule{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);margin-bottom:4px;}
.rule i{font-size:.65rem;}
.rule.pass{color:var(--teal);}
</style>
</head>
<body>
<div class="bg-orb orb1"></div><div class="bg-orb orb2"></div>
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px;">
    <div class="logo">EduConnect</div>
    <select data-lang-switcher style="padding:8px 10px;border-radius:999px;border:1px solid #333;background:#000;color:#fff;font-size:.8rem;">
      <option value="en">English</option>
      <option value="hi">हिंदी</option>
      <option value="ta">தమిழ்</option>
      <option value="te">తెలుగు</option>
      <option value="kn">ಕನ್ನಡ</option>
    </select>
  </div>
  <div class="title" data-i18n="auth.setPasswordTitle">Set Your Password</div>
  <div class="sub" id="modeDesc" data-i18n="auth.setPasswordSub">Enter the setup token from your welcome email, then create a secure password for your account.</div>

  <div class="msg" id="msgBox"></div>

  <div id="tokenSection">
    <div class="field">
      <label data-i18n="auth.setupToken">Setup Token (from email)</label>
      <div class="input-wrap"><i class="fa fa-key icon"></i><input type="text" id="tokenInput" data-i18n-placeholder="auth.setupTokenPlaceholder" placeholder="Paste token from email…"/></div>
    </div>
  </div>

  <div class="field">
    <label data-i18n="auth.newPassword">New Password</label>
    <div class="input-wrap">
      <i class="fa fa-lock icon"></i>
      <input type="password" id="pw1" data-i18n-placeholder="auth.newPasswordPlaceholder" placeholder="Minimum 6 characters" oninput="checkStrength()" autocomplete="off"/>
      <span class="eye" onclick="togglePw('pw1','eye1')"><i class="fa fa-eye" id="eye1"></i></span>
    </div>
    <div class="strength"><div class="strength-fill" id="strengthBar"></div></div>
    <div class="strength-label" id="strengthLabel">Enter a password</div>
  </div>

  <div class="field">
    <label data-i18n="auth.confirmPassword">Confirm Password</label>
    <div class="input-wrap">
      <i class="fa fa-lock icon"></i>
      <input type="password" id="pw2" data-i18n-placeholder="auth.confirmPasswordPlaceholder" placeholder="Repeat password" autocomplete="off"/>
      <span class="eye" onclick="togglePw('pw2','eye2')"><i class="fa fa-eye" id="eye2"></i></span>
    </div>
  </div>

  <div style="margin-bottom:18px;">
    <div class="rule" id="r1"><i class="fa fa-circle"></i> <span data-i18n="auth.ruleMin">At least 6 characters</span></div>
    <div class="rule" id="r2"><i class="fa fa-circle"></i> <span data-i18n="auth.ruleNumber">Contains a number</span></div>
    <div class="rule" id="r3"><i class="fa fa-circle"></i> <span data-i18n="auth.ruleMatch">Passwords match</span></div>
  </div>

  <button class="btn" id="submitBtn" onclick="submit()"><i class="fa fa-check-circle"></i> <span data-i18n="auth.setPassword">Set Password</span></button>
  <div class="back"><a href="index.html"><i class="fa fa-arrow-left"></i> <span data-i18n="auth.backToLogin">Back to Login</span></a></div>
</div>

<script src="lang.js"></script>
<script>
initLanguage({ titleKey: 'app.title.setPassword' });

// If token is in URL params (?token=xxx), prefill and hide the token field
const urlToken = new URLSearchParams(location.search).get('token');
const isFirstLogin = new URLSearchParams(location.search).get('mode') === 'first-login';
const pendingToken = sessionStorage.getItem('token');
if (urlToken || isFirstLogin || pendingToken) {
  const tokenSection = document.getElementById('tokenSection');
  if (tokenSection) tokenSection.style.display = 'none';
  const modeDesc = document.getElementById('modeDesc');
  if (modeDesc) {
    modeDesc.textContent = isFirstLogin || pendingToken
      ? 'Create your new password to continue to the staff dashboard.'
      : 'Create a secure password for your EduConnect account.';
  }
}

function togglePw(id, iconId) {
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
  document.getElementById(iconId).className = el.type === 'password' ? 'fa fa-eye' : 'fa fa-eye-slash';
}

function checkStrength() {
  const pw = document.getElementById('pw1').value;
  const bar = document.getElementById('strengthBar');
  const lbl = document.getElementById('strengthLabel');
  let score = 0;
  if (pw.length >= 6) score++;
  if (pw.length >= 10) score++;
  if (/\d/.test(pw)) score++;
  if (/[^a-zA-Z0-9]/.test(pw)) score++;
  const colors = ['','#f87171','#f59e0b','#00d4aa','#38bdf8'];
  const labels = ['','Weak','Fair','Strong','Very Strong'];
  bar.style.width = (score * 25) + '%';
  bar.style.background = colors[score] || 'transparent';
  lbl.textContent = labels[score] || 'Enter a password';

  const pw2 = document.getElementById('pw2').value;
  rule('r1', pw.length >= 6);
  rule('r2', /\d/.test(pw));
  rule('r3', pw === pw2 && pw.length > 0);
}

const pw2Input = document.getElementById('pw2');
if (pw2Input) {
  pw2Input.addEventListener('input', checkStrength);
}

function rule(id, pass) {
  const el = document.getElementById(id);
  el.className = 'rule' + (pass ? ' pass' : '');
  el.querySelector('i').className = pass ? 'fa fa-check-circle' : 'fa fa-circle';
}

function showMsg(msg, type='err') {
  const el = document.getElementById('msgBox');
  el.textContent = msg;
  el.className = `msg ${type}`;
  el.style.display = 'flex';
}

async function submit() {
  const token = urlToken || document.getElementById('tokenInput')?.value.trim();
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  if (pw1.length < 6) { showMsg(window.t('auth.passwordTooShort')); return; }
  if (pw1 !== pw2)  { showMsg(window.t('auth.passwordMismatch')); return; }

  const btn = document.getElementById('submitBtn');
  if (!btn) {
    console.error('submit: submitBtn element not found');
    showMsg('Submit button is not available. Please reload the page.','err');
    return;
  }
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> ' + window.t('auth.settingPassword');

  try {
    let res;
    let data;

    if (isFirstLogin || pendingToken) {
      const jwtToken = pendingToken || sessionStorage.getItem('token');
      if (!jwtToken) {
        showMsg('Your session has expired. Please log in again.');
        return;
      }
      res = await fetch('https://erp-3-dgz3.onrender.com/api/auth/first-login-set-password', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${jwtToken}`,
        },
        body: JSON.stringify({ newPassword: pw1 }),
      });
      data = await res.json();
      if (!res.ok) { showMsg(data.error || window.t('auth.passwordSetFailed')); return; }
      sessionStorage.setItem('token', jwtToken);
      sessionStorage.setItem('user', JSON.stringify(data.user));
      sessionStorage.removeItem('pendingPasswordReset');
      showMsg(window.t('auth.passwordSet'), 'ok');
      setTimeout(() => location.href = 'admin.html', 1200);
      return;
    }

    if (!token)       { showMsg(window.t('auth.enterToken')); return; }
    res = await fetch('https://erp-3-dgz3.onrender.com/api/auth/set-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, newPassword: pw1 }),
    });
    data = await res.json();
    if (!res.ok) { showMsg(data.error || window.t('auth.passwordSetFailed')); return; }
    showMsg(window.t('auth.passwordSet'), 'ok');
    setTimeout(() => location.href = 'index.html', 2000);
  } catch {
    showMsg(window.t('auth.passwordConnectError'));
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa fa-check-circle"></i> ' + window.t('auth.setPassword');
    }
  }
}
</script>
</body>
</html>
