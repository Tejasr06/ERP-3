<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>EduConnect — Forgot Password</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--ink:#ffffff;--card:#ffffff;--teal:#0d6efd;--sky:#60a5fa;--coral:#ef4444;--text:#111827;--muted:#6b7280;--border:rgba(0,0,0,0.06);--font-display:Arial, Helvetica, sans-serif;--font-body:Arial, Helvetica, sans-serif;}
html,body{height:100%;font-family:var(--font-body);background:var(--ink);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;}
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;}
.o1{width:400px;height:400px;background:radial-gradient(circle,rgba(0,212,170,.12),transparent 70%);top:-100px;left:-100px;}
.o2{width:300px;height:300px;background:radial-gradient(circle,rgba(56,189,248,.1),transparent 70%);bottom:-60px;right:-60px;}
.card{position:relative;z-index:1;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:44px 40px;width:100%;max-width:400px;box-shadow:0 28px 70px rgba(0,0,0,.5);}
.logo{font-family:var(--font-display);font-size:1.7rem;background:linear-gradient(135deg,var(--teal),var(--sky));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:24px;}
.title{font-family:var(--font-display);font-size:1.5rem;margin-bottom:4px;}
.sub{font-size:.85rem;color:var(--muted);margin-bottom:28px;line-height:1.6;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:7px;letter-spacing:.08em;text-transform:uppercase;}
.iw{position:relative;}
.iw i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem;}
.iw input{width:100%;padding:12px 14px 12px 38px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);font-family:var(--font-body);font-size:.92rem;outline:none;transition:.2s;}
.iw input:focus{border-color:var(--teal);}
.btn{width:100%;padding:13px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--teal),var(--sky));color:#0d1117;font-weight:700;font-size:.95rem;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,212,170,.35);}
.btn:disabled{opacity:.6;transform:none;}
.msg{padding:12px 14px;border-radius:9px;font-size:.83rem;margin-bottom:14px;display:none;align-items:center;gap:8px;}
.msg.err{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--coral);}
.msg.ok{background:rgba(0,212,170,.1);border:1px solid rgba(0,212,170,.3);color:var(--teal);}
.back{text-align:center;margin-top:18px;font-size:.83rem;color:var(--muted);}
.back a{color:var(--teal);text-decoration:none;}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(13,17,23,.3);border-top-color:#0d1117;border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px;">
    <div class="logo">EduConnect</div>
    <select data-lang-switcher style="padding:8px 10px;border-radius:999px;border:1px solid #333;background:#000;color:#fff;font-size:.8rem;">
      <option value="en">English</option>
      <option value="hi">हिंदी</option>
      <option value="ta">தமிழ்</option>
      <option value="te">తెలుగు</option>
      <option value="kn">ಕನ್ನಡ</option>
    </select>
  </div>
  <div class="title" data-i18n="auth.forgotTitle">Forgot Password?</div>
  <div class="sub" data-i18n="auth.forgotSub">Enter your registered email and we'll send you a reset link.</div>
  <div class="msg" id="msgBox"></div>
  <div class="field">
    <label data-i18n="auth.emailAddress">Email Address</label>
    <div class="iw"><i class="fa fa-envelope"></i><input type="email" id="email" data-i18n-placeholder="auth.emailPlaceholder" placeholder="your@email.com" autocomplete="email"/></div>
  </div>
  <button class="btn" id="submitBtn" onclick="submit()"><i class="fa fa-paper-plane"></i> <span data-i18n="auth.sendReset">Send Reset Link</span></button>
  <div class="back"><a href="index.html"><i class="fa fa-arrow-left"></i> <span data-i18n="auth.backToLogin">Back to Login</span></a></div>
</div>
<script src="lang.js"></script>
<script>
const forgotEmail = document.getElementById('email');
if (forgotEmail) {
  forgotEmail.addEventListener('keypress', e => { if (e.key === 'Enter') submit(); });
}
initLanguage({ titleKey: 'app.title.forgot' });

async function submit() {
  const email = document.getElementById('email')?.value.trim();
  if (!email) { show(window.t('auth.enterEmail'),'err'); return; }
  const btn = document.getElementById('submitBtn');
  if (!btn) {
    console.error('submit: submitBtn element not found');
    show('Submit button is not available. Please reload the page.','err');
    return;
  }
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> ' + window.t('auth.sending');
  try {
    const r = await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    const d = await r.json();
    show(d.message||window.t('auth.resetLinkSent'),'ok');
  } catch { show(window.t('auth.resetUnavailable'),'err'); }
  finally {
    if (btn) {
      btn.disabled=false;
      btn.innerHTML='<i class="fa fa-paper-plane"></i> ' + window.t('auth.sendReset');
    }
  }
}
function show(msg,type){
  const el=document.getElementById('msgBox');
  if (!el) {
    console.error('show: msgBox element not found');
    return;
  }
  el.textContent=msg;el.className='msg '+type;el.style.display='flex';
}
</script>
</body>
</html>
